<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel ABM - Gestor de Evaluaciones Psicotécnicas</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>

    <div class="container">
        <h1>Panel de Administración y ABM</h1>
        <p class="subtitle">Gestione de forma limpia y ordenada las áreas, cargos y dinámicas de la carpeta <code>datos</code>.</p>

        <div class="toolbar" style="flex-direction: column; align-items: stretch; gap: 15px;">
            <div class="status-badge">
                📁 Estado: <span id="estadoCarga" style="color: var(--accent);">Cargando...</span>
            </div>
            <div style="display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px;">
                <div class="btn-group">
                    <button class="btn-success" style="background-color: #27ae60;" onclick="abrirModalArea()">+ Crear Nueva Área</button>
                    <button class="btn-warning" onclick="abrirModalCargo()">+ Crear Nuevo Cargo</button>
                    <button class="btn-secondary" onclick="descargarJSON()">📥 Descargar JSON Actualizado</button>
                </div>
                <div>
                    <button onclick="window.location.href='index.html'" style="background-color: #34495e; color: white; border: none; padding: 10px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: background 0.2s;" onmouseover="this.style.backgroundColor='#2c3e50'" onmouseout="this.style.backgroundColor='#34495e'">
                        ⬅️ Volver al Generador
                    </button>
                </div>
            </div>
        </div>

        <div class="control-panel">
            <div class="form-group">
                <label for="cargoSelectAdmin">Seleccionar Cargo a Administrar:</label>
                <select id="cargoSelectAdmin" onchange="renderizarDinamicas()"></select>
            </div>
            <div>
                <button class="btn-success" onclick="abrirModalDinamica()" style="width: 100%;">+ Nueva Dinámica</button>
            </div>
        </div>

        <div class="section-header">
            <h2 id="tituloListaCargo">Dinámicas Asociadas</h2>
        </div>
        <div id="listaDinamicas">
            <!-- Se llena dinámicamente -->
        </div>
    </div>

    <!-- Modal: Crear Nueva Área -->
    <div id="modalAreaNueva" class="modal">
        <div class="modal-content" style="max-width: 450px;">
            <h3>Crear Nueva Área</h3>
            <form id="formArea" onsubmit="guardarArea(event)">
                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="areaNombreNueva">Nombre completo del Área:</label>
                    <input type="text" id="areaNombreNueva" placeholder="Ej: Tecnología y Sistemas" required>
                </div>
                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="areaSiglaNueva">Sigla (Exactamente 3 letras):</label>
                    <input type="text" id="areaSiglaNueva" placeholder="Ej: TEC" maxlength="3" minlength="3" style="text-transform: uppercase;" required>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 25px;">
                    <button type="submit" class="btn-success">Guardar Área</button>
                    <button type="button" class="btn-danger" onclick="cerrarModalArea()">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Crear Nuevo Cargo -->
    <div id="modalCargoNuevo" class="modal">
        <div class="modal-content" style="max-width: 550px;">
            <h3>Crear Nuevo Cargo</h3>
            <form id="formCargo" onsubmit="guardarCargo(event)">
                
                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="cargoNombreInput">Nombre legible del Cargo:</label>
                    <input type="text" id="cargoNombreInput" placeholder="Ej: Administrador de Redes" required>
                </div>

                <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 10px; margin-bottom: 15px;">
                    <div class="form-group">
                        <label for="cargoAreaSelect">Área a la que pertenece:</label>
                        <select id="cargoAreaSelect" onchange="actualizarCodigoCargoAutogenerado()" required>
                            <!-- Se llena dinámicamente con las áreas del JSON -->
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="cargoEspecialidad">Sigla Especialidad:</label>
                        <input type="text" id="cargoEspecialidad" placeholder="Ej: RED" maxlength="3" style="text-transform: uppercase;" oninput="actualizarCodigoCargoAutogenerado()" required>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="cargoKeyInput">Código del Cargo (Autogenerado):</label>
                    <input type="text" id="cargoKeyInput" style="background-color: #eaeded; font-family: monospace; font-weight: bold; color: #7f8c8d; border: 1px dashed #bdc3c7;" readonly required placeholder="Seleccione área y sigla para generar">
                </div>

                <div style="display: flex; gap: 10px; margin-top: 25px;">
                    <button type="submit" class="btn-success">Crear Cargo</button>
                    <button type="button" class="btn-danger" onclick="cerrarModalCargo()">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Crear/Editar Dinámica -->
    <div id="modalDinamica" class="modal">
        <div class="modal-content">
            <h3 id="modalTitulo">Nueva Dinámica</h3>
            <form id="formDinamica" onsubmit="guardarDinamica(event)">
                <input type="hidden" id="editIndex" value="">
                
                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="modalCargo">Cargo Objetivo:</label>
                    <select id="modalCargo" onchange="actualizarCodigoDinamicaAutogenerado()"></select>
                </div>

                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="modalCodigo">Código Alfanumérico (Autogenerado):</label>
                    <input type="text" id="modalCodigo" style="background-color: #eaeded; font-family: monospace; font-weight: bold; color: #7f8c8d;" readonly required>
                </div>

                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="modalTituloDin">Título de la Dinámica:</label>
                    <input type="text" id="modalTituloDin" required>
                </div>

                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="modalDesc">Descripción Breve:</label>
                    <input type="text" id="modalDesc" required>
                </div>

                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="modalTiempo">Tiempo Límite:</label>
                    <input type="text" id="modalTiempo" placeholder="Ej: 3 Minutos Exactos" required>
                </div>

                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="modalHoja">Hoja de Trabajo / Consigna para el Postulante:</label>
                    <textarea id="modalHoja" rows="4" placeholder="Texto o consigna que verá el candidato..." required></textarea>
                </div>

                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="modalCaso">Objetivo / Consigna para el Evaluador:</label>
                    <input type="text" id="modalCaso" required>
                </div>

                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="modalGuia">Guía de Observación (Éxito / Alerta):</label>
                    <textarea id="modalGuia" rows="3" required></textarea>
                </div>

                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="modalRespuesta">Corrector: Respuestas Correctas / Esperadas:</label>
                    <textarea id="modalRespuesta" rows="4"></textarea>
                </div>

                <div style="display: flex; gap: 10px; margin-top: 25px;">
                    <button type="submit" class="btn-success">Guardar Dinámica</button>
                    <button type="button" class="btn-danger" onclick="cerrarModalDinamica()">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="datos/datos.js"></script>
    <script src="admin.js"></script>
</body>
</html>
