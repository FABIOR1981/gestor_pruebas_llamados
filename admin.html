<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel ABM - Gestor de Evaluaciones Psicotécnicas</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>

    <div class="container">
        <h1>Panel de Administración y ABM</h1>
        <p class="subtitle">Gestione de forma limpia y ordenada las áreas, cargos y dinámicas del archivo <code>datos.json</code>.</p>

        <div class="toolbar toolbar-columna">
            <div class="status-badge">
                📁 Estado: <span id="estadoCarga">Cargando...</span>
            </div>
            <div class="barra-botones">
                <div class="btn-group">
                    <button type="button" id="btnNuevaArea" class="btn-success">+ Crear Nueva Área</button>
                    <button type="button" id="btnNuevoCargo" class="btn-warning">+ Crear Nuevo Cargo</button>
                    <button type="button" id="btnDescargar" class="btn-secondary">📥 Descargar JSON Actualizado</button>
                </div>
                <a class="btn-link" href="index.html">⬅️ Volver al Generador</a>
            </div>
        </div>

        <div class="control-panel">
            <div class="form-group">
                <label for="cargoSelectAdmin">Seleccionar Cargo a Administrar:</label>
                <select id="cargoSelectAdmin"></select>
            </div>
            <div>
                <button type="button" id="btnNuevaDinamica" class="btn-success btn-ancho">+ Nueva Dinámica</button>
            </div>
        </div>

        <div class="section-header">
            <h2 id="tituloListaCargo">Dinámicas Asociadas</h2>
        </div>
        <div id="listaDinamicas">
            <!-- Se llena dinámicamente -->
        </div>
    </div>

    <!-- Modal: Crear Nueva Área -->
    <div id="modalAreaNueva" class="modal">
        <div class="modal-content modal-chico">
            <h3>Crear Nueva Área</h3>
            <form id="formArea">
                <div class="form-group campo">
                    <label for="areaNombreNueva">Nombre completo del Área:</label>
                    <input type="text" id="areaNombreNueva" placeholder="Ej: Tecnología y Sistemas" required>
                </div>
                <div class="form-group campo">
                    <label for="areaSiglaNueva">Sigla (Exactamente 3 letras):</label>
                    <input type="text" id="areaSiglaNueva" class="mayusculas" placeholder="Ej: TEC" maxlength="3" minlength="3" required>
                </div>
                <div class="acciones-modal">
                    <button type="submit" class="btn-success">Guardar Área</button>
                    <button type="button" id="btnCancelarArea" class="btn-danger">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Crear Nuevo Cargo -->
    <div id="modalCargoNuevo" class="modal">
        <div class="modal-content modal-mediano">
            <h3>Crear Nuevo Cargo</h3>
            <form id="formCargo">

                <div class="form-group campo">
                    <label for="cargoNombreInput">Nombre legible del Cargo:</label>
                    <input type="text" id="cargoNombreInput" placeholder="Ej: Administrador de Redes" required>
                </div>

                <div class="grid-cargo">
                    <div class="form-group">
                        <label for="cargoAreaSelect">Área a la que pertenece:</label>
                        <select id="cargoAreaSelect" required>
                            <!-- Se llena dinámicamente con las áreas del JSON -->
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="cargoEspecialidad">Sigla Especialidad:</label>
                        <input type="text" id="cargoEspecialidad" class="mayusculas" placeholder="Ej: RED" maxlength="3" required>
                    </div>
                </div>

                <div class="form-group campo">
                    <label for="cargoKeyInput">Código del Cargo (Autogenerado):</label>
                    <input type="text" id="cargoKeyInput" class="input-codigo" readonly required placeholder="Seleccione área y sigla para generar">
                </div>

                <div class="acciones-modal">
                    <button type="submit" class="btn-success">Crear Cargo</button>
                    <button type="button" id="btnCancelarCargo" class="btn-danger">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Crear/Editar Dinámica -->
    <div id="modalDinamica" class="modal">
        <div class="modal-content">
            <h3 id="modalTitulo">Nueva Dinámica</h3>
            <form id="formDinamica">
                <input type="hidden" id="editIndex" value="">

                <div class="form-group campo">
                    <label for="modalCargo">Cargo Objetivo:</label>
                    <select id="modalCargo"></select>
                </div>

                <div class="form-group campo">
                    <label for="modalCodigo">Código Alfanumérico (Autogenerado):</label>
                    <input type="text" id="modalCodigo" class="input-codigo" readonly required>
                </div>

                <div class="form-group campo">
                    <label for="modalTituloDin">Título de la Dinámica:</label>
                    <input type="text" id="modalTituloDin" required>
                </div>

                <div class="form-group campo">
                    <label for="modalDesc">Descripción Breve:</label>
                    <input type="text" id="modalDesc" required>
                </div>

                <div class="form-group campo">
                    <label for="modalTiempo">Tiempo Límite:</label>
                    <input type="text" id="modalTiempo" placeholder="Ej: 3 Minutos Exactos" required>
                </div>

                <div class="form-group campo">
                    <label for="modalHoja">Hoja de Trabajo / Consigna para el Postulante:</label>
                    <textarea id="modalHoja" rows="4" placeholder="Texto o consigna que verá el candidato..." required></textarea>
                </div>

                <div class="form-group campo">
                    <label for="modalCaso">Objetivo / Consigna para el Evaluador:</label>
                    <input type="text" id="modalCaso" required>
                </div>

                <div class="form-group campo">
                    <label for="modalGuia">Guía de Observación (Éxito / Alerta):</label>
                    <textarea id="modalGuia" rows="3" required></textarea>
                </div>

                <div class="acciones-modal">
                    <button type="submit" class="btn-success">Guardar Dinámica</button>
                    <button type="button" id="btnCancelarDinamica" class="btn-danger">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="utilidades.js"></script>
    <script src="admin.js"></script>
</body>
</html>
