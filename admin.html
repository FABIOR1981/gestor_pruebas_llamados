<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel ABM - Gestor de Evaluaciones Psicotécnicas</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>

    <div class="container">
        <h1>Panel de Administración y ABM</h1>
        <p class="subtitle">Gestione de forma limpia y ordenada los cargos, dinámicas y contenidos del archivo <code>datos.json</code>.</p>

        <div class="toolbar">
            <div class="status-badge">
                📁 Estado: <span id="estadoCarga" style="color: var(--accent);">Cargando...</span>
            </div>
            <div class="btn-group">
                <button class="btn-warning" onclick="abrirModalCargo()">+ Crear Nuevo Cargo</button>
                <button class="btn-secondary" onclick="descargarJSON()">📥 Descargar JSON Actualizado</button>
            </div>
        </div>

        <div class="control-panel">
            <div class="form-group">
                <label for="cargoSelectAdmin">Seleccionar Cargo a Administrar:</label>
                <select id="cargoSelectAdmin" onchange="renderizarDinamicas()"></select>
            </div>
            <div>
                <button class="btn-success" onclick="abrirModalDinamica()" style="width: 100%;">+ Nueva Dinámica</button>
            </div>
        </div>

        <div class="section-header">
            <h2 id="tituloListaCargo">Dinámicas Asociadas</h2>
        </div>
        <div id="listaDinamicas">
            <!-- Se llena dinámicamente -->
        </div>
    </div>

    <!-- Modal: Crear/Editar Dinámica -->
    <div id="modalDinamica" class="modal">
        <div class="modal-content">
            <h3 id="modalTitulo">Nueva Dinámica</h3>
            <form id="formDinamica" onsubmit="guardarDinamica(event)">
                <input type="hidden" id="editIndex" value="-1">
                
                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="modalCargo">Cargo Objetivo:</label>
                    <select id="modalCargo"></select>
                </div>

                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="modalCodigo">Código Alfanumérico (Ej: CAR-03, ADM-03):</label>
                    <input type="text" id="modalCodigo" required>
                </div>

                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="modalTituloDin">Título de la Dinámica:</label>
                    <input type="text" id="modalTituloDin" required>
                </div>

                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="modalDesc">Descripción Breve:</label>
                    <input type="text" id="modalDesc" required>
                </div>

                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="modalTiempo">Tiempo Límite:</label>
                    <input type="text" id="modalTiempo" placeholder="Ej: 3 Minutos Exactos" required>
                </div>

                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="modalHoja">Hoja de Trabajo / Consigna para el Postulante:</label>
                    <textarea id="modalHoja" rows="4" placeholder="Texto o consigna que verá el candidato..." required></textarea>
                </div>

                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="modalCaso">Objetivo / Consigna para el Evaluador:</label>
                    <input type="text" id="modalCaso" required>
                </div>

                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="modalGuia">Guía de Observación (Éxito / Alerta):</label>
                    <textarea id="modalGuia" rows="3" required></textarea>
                </div>

                <div style="display: flex; gap: 10px; margin-top: 25px;">
                    <button type="submit" class="btn-success">Guardar Dinámica</button>
                    <button type="button" class="btn-danger" onclick="cerrarModalDinamica()">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Crear Nuevo Cargo -->
    <div id="modalCargoNuevo" class="modal">
        <div class="modal-content" style="max-width: 450px;">
            <h3>Crear Nuevo Cargo</h3>
            <form id="formCargo" onsubmit="guardarCargo(event)">
                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="cargoKeyInput">Identificador clave (sin espacios, ej: <code>operario</code>):</label>
                    <input type="text" id="cargoKeyInput" placeholder="Ej: logistica" required>
                </div>

                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="cargoNombreInput">Nombre legible del Cargo:</label>
                    <input type="text" id="cargoNombreInput" placeholder="Ej: Operario Logístico" required>
                </div>

                <div style="display: flex; gap: 10px; margin-top: 25px;">
                    <button type="submit" class="btn-success">Crear Cargo</button>
                    <button type="button" class="btn-danger" onclick="cerrarModalCargo()">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
